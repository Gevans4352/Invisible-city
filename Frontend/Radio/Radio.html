<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Radio</title>
    <link rel="stylesheet" href="./Radio.css" />

  <body>
    <div class="radio-page">
      <nav class="nav">
        <a href="../App/app.html" class="nav-logo">Invisible City</a>
        <div class="nav-tabs">
          <a href="../App/app.html" class="tab">City</a>
          <a href="../Cabinet/cabinet.html" class="tab">Cabinet</a>
          <span class="tab active">Radio</span>
        </div>
      </nav>

      <main class="main">
        <div class="radio-visual" id="radio-visual">
          <svg
            width="100%"
            viewBox="0 0 680 400"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
          >
            <title>Kawaii radio illustration</title>
            <desc>
              A cute pink kawaii radio with antenna, speaker, dials and
              decorative stars
            </desc>
            <style>
              @keyframes blink {
                0%,
                100% {
                  opacity: 1;
                }
                50% {
                  opacity: 0.2;
                }
              }
              @keyframes wave {
                0%,
                100% {
                  transform: scaleY(1);
                }
                50% {
                  transform: scaleY(1.6);
                }
              }
              .blink {
                animation: blink 1.8s ease-in-out infinite;
              }
              .blink2 {
                animation: blink 2.4s ease-in-out infinite 0.6s;
              }
              .blink3 {
                animation: blink 1.4s ease-in-out infinite 1s;
              }
              .bar1 {
                animation: wave 0.8s ease-in-out infinite;
                transform-origin: center bottom;
              }
              .bar2 {
                animation: wave 0.8s ease-in-out infinite 0.15s;
                transform-origin: center bottom;
              }
              .bar3 {
                animation: wave 0.8s ease-in-out infinite 0.3s;
                transform-origin: center bottom;
              }
              .bar4 {
                animation: wave 0.8s ease-in-out infinite 0.45s;
                transform-origin: center bottom;
              }
              .bar5 {
                animation: wave 0.8s ease-in-out infinite 0.6s;
                transform-origin: center bottom;
              }
            </style>

              x="190"
              y="140"
              width="300"
              height="190"
              rx="24"
              fill="#ffb3d1"
            />
            <rect

              rx="18"

              stroke="#ff85b3"
              stroke-width="4"

            <circle cx="268" cy="56" r="8" fill="#ff2d78" />

            <rect
              x="215"

              width="110"

              rx="12"

            <circle cx="390" cy="195" r="38" fill="#ffb3d1" />

          <button type="button" onclick="submitFragment()">✦ Transmit ✦</button>
